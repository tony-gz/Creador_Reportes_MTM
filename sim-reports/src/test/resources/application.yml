# Configuración de tests. La URL/usuario del datasource los fija
# PostgresEmbebido (PostgreSQL real levantado en un puerto libre), así que
# aquí no se declaran. El esquema lo aplica Flyway igual que en producción.
spring:
  flyway:
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

simreports:
  almacenamiento:
    # Los tests que escriben archivos la cambian por una carpeta temporal propia.
    directorio: ${java.io.tmpdir}/sim-reports-tests/datos
