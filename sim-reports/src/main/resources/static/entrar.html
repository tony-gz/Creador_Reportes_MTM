<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Reportes de consumo SIM</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/entrar.js"></script>
</head>
<body>
  <main class="pagina-entrar">
    <section class="tarjeta tarjeta-entrar">
      <h1>Reportes de consumo SIM</h1>
      <p class="subtitulo">Entra con tu usuario y contraseña.</p>
      <form id="formulario-entrar" class="formulario" novalidate>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div id="mensaje-entrar" aria-live="polite"></div>
        <div class="acciones">
          <button type="submit" class="boton" id="boton-entrar">Entrar</button>
        </div>
      </form>
    </section>
  </main>
  <noscript>
    <p class="aviso aviso-error">Esta página necesita JavaScript.</p>
  </noscript>
</body>
</html>
