spring:
  application:
    name: sim-reports

  # La plantilla pesa ~200 KB y los archivos de los operadores menos de 1 MB;
  # el límite por defecto de Spring (1 MB) queda justo. Cada corrida sube los
  # 4 archivos juntos (D-023).
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 80MB

  datasource:
    url: ${SIMREPORTS_DB_URL:jdbc:postgresql://localhost:5432/sim_reports}
    username: ${SIMREPORTS_DB_USER:sim_reports}
    password: ${SIMREPORTS_DB_PASSWORD:sim_reports}

  # El esquema lo crean/actualizan las migraciones de Flyway
  # (src/main/resources/db/migration). Un cambio de esquema = un archivo
  # V<n>__descripcion.sql nuevo; nunca se edita una migración ya aplicada.
  flyway:
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      # Hibernate solo comprueba que las entidades coincidan con el esquema
      # creado por Flyway; si no coinciden, la app no arranca.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

# Sesión (D-026, spec 12): expira tras 30 min sin uso; cookie solo por HTTPS,
# inaccesible desde JavaScript. En local por http://localhost los navegadores
# aceptan la cookie Secure; para otro host sin HTTPS: SIMREPORTS_COOKIE_SEGURA=false.
server:
  # Render termina el HTTPS antes de la app y avisa con X-Forwarded-*.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SIMREPORTS_COOKIE_SEGURA:true}
        same-site: lax

simreports:
  # Primer superadmin (D-024): solo se usa si no existe ningún usuario.
  admin:
    usuario: ${SIMREPORTS_ADMIN_USUARIO:}
    password: ${SIMREPORTS_ADMIN_PASSWORD:}
    nombre: ${SIMREPORTS_ADMIN_NOMBRE:Administrador}
